name: Build Xabarchi APK (arm64-v8a)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Free disk space on runner (~25GB)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk/*
          df -h

      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configure pre-installed Android SDK & install NDK/CMake
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMGR="$(command -v sdkmanager || find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n1)"
          if [ -z "$SDKMGR" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-extract
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv /tmp/cmdline-extract/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-extract
            SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          [ -x "$SDKMGR" ] || sudo chmod +x "$SDKMGR"
          echo "$(dirname "$SDKMGR")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          NDK_VER=$(python3 -c 'import re,pathlib; s=pathlib.Path("TMessagesProj/build.gradle").read_text(); m=re.search(r"ndkVersion\s+[\"\x27]([^\"\x27]+)[\"\x27]", s); print(m.group(1) if m else "27.2.12479018")')
          COMPILE_SDK=$(python3 -c 'import re,pathlib; s=pathlib.Path("TMessagesProj/build.gradle").read_text(); m=re.search(r"compileSdk(?:Version)?\s+(\d+)", s); print(m.group(1) if m else "36")')
          echo "Detected compileSdk=$COMPILE_SDK, ndkVersion=$NDK_VER"

          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VER}" \
            "cmake;3.22.1"

      - name: Auto-unpack Xabarchi_GitHub_Pack (ZIP or subfolder)
        run: |
          python3 - << 'PY'
          import glob, os, shutil, zipfile

          if not os.path.exists("scripts/apply_xabarchi_patches.py"):
              zips = sorted(glob.glob("*Xabarchi*.zip") + glob.glob("*xabarchi*.zip"))
              if zips:
                  zpath = zips[0]
                  print(f"ZIP topildi: {zpath}, arxivdan chiqarilmoqda...")
                  with zipfile.ZipFile(zpath, "r") as zf:
                      for info in zf.infolist():
                          if info.filename.startswith(".github/"):
                              continue
                          zf.extract(info, ".")
              else:
                  for root, dirs, files in os.walk("."):
                      if "apply_xabarchi_patches.py" in files and os.path.basename(root) == "scripts":
                          parent = os.path.dirname(root)
                          if parent not in (".", ""):
                              print(f"Ichki papka topildi: {parent}, asosiy papkaga ko'chirilmoqda...")
                              for item in ["scripts", "TMessagesProj", "settings.gradle", "README.txt"]:
                                  src = os.path.join(parent, item)
                                  if os.path.isdir(src):
                                      shutil.copytree(src, item, dirs_exist_ok=True)
                                  elif os.path.isfile(src):
                                      shutil.copy2(src, item)
                              break
          PY
          ls -la
          ls -la scripts/ || true

      - name: Apply Xabarchi rebranding, Liquid Glass UI patches & API credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ ! -f "scripts/apply_xabarchi_patches.py" ]; then
            echo "::error::Xabarchi_GitHub_Pack.zip repozitoriyga yuklanmagan! Uni Code -> Add file -> Upload files orqali yuklang."
            exit 1
          fi
          python3 scripts/apply_xabarchi_patches.py

      - name: Create dummy google-services.json for com.xabarchi.app
        run: |
          cat << 'EOF' > google-services-dummy.json
          {
            "project_info": {
              "project_number": "100000000000",
              "project_id": "xabarchi-dummy",
              "storage_bucket": "xabarchi-dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:100000000000:android:0000000000000000000001",
                  "android_client_info": {
                    "package_name": "com.xabarchi.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForCloudBuildOnly0000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:100000000000:android:0000000000000000000002",
                  "android_client_info": {
                    "package_name": "com.xabarchi.app.beta"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForCloudBuildOnly0000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          cp google-services-dummy.json TMessagesProj/google-services.json
          cp google-services-dummy.json TMessagesProj_App/google-services.json

      - name: Configure Gradle memory & arm64-v8a flags
        run: |
          chmod +x gradlew
          echo "" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties

      - name: Build Xabarchi Debug APK (arm64-v8a only)
        run: |
          if grep -q "afat" TMessagesProj_App/build.gradle; then
            TASK=":TMessagesProj_App:assembleAfatDebug"
          else
            TASK=":TMessagesProj_App:assembleDebug"
          fi
          echo "Running Gradle task: $TASK"
          ./gradlew "$TASK" \
            -Parm64-v8a \
            -Pandroid.injected.build.abi=arm64-v8a \
            --no-daemon \
            --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out_apk
          find TMessagesProj_App/build/outputs/apk -type f -name "*.apk" -exec cp {} out_apk/ \;
          ls -lh out_apk/

      - name: Upload Xabarchi APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xabarchi-arm64-debug-apk
          path: out_apk/*.apk
          retention-days: 14
