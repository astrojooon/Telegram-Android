name: Build Xabarchi APK (arm64-v8a)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Free disk space on runner (~25GB)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk/*
          df -h

      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Detect and install exact SDK, Build Tools, NDK & CMake
        run: |
          NDK_VER=$(grep -Eo "ndkVersion[[:space:]]+[\"'][^\"']+[\"']" TMessagesProj/build.gradle | head -n1 | sed -E "s/.*[\"']([^\"']+)[\"'].*/\1/")
          if [ -z "$NDK_VER" ]; then NDK_VER="27.2.12479018"; fi
          COMPILE_SDK=$(grep -Eo 'compileSdk(Version)?[[:space:]]+[0-9]+' TMessagesProj/build.gradle | head -n1 | grep -Eo '[0-9]+')
          if [ -z "$COMPILE_SDK" ]; then COMPILE_SDK="36"; fi
          echo "Detected compileSdk=$COMPILE_SDK, ndkVersion=$NDK_VER"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;35.0.0" \
            "build-tools;${COMPILE_SDK}.0.0" \
            "ndk;${NDK_VER}" \
            "cmake;3.22.1" || sdkmanager --install \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VER}" \
            "cmake;3.22.1"

      - name: Apply Xabarchi rebranding, Liquid Glass UI patches & API credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python3 scripts/apply_xabarchi_patches.py

      - name: Create dummy google-services.json for com.xabarchi.app
        run: |
          cat << 'EOF' > google-services-dummy.json
          {
            "project_info": {
              "project_number": "100000000000",
              "project_id": "xabarchi-dummy",
              "storage_bucket": "xabarchi-dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:100000000000:android:0000000000000000000001",
                  "android_client_info": {
                    "package_name": "com.xabarchi.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForCloudBuildOnly0000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:100000000000:android:0000000000000000000002",
                  "android_client_info": {
                    "package_name": "com.xabarchi.app.beta"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForCloudBuildOnly0000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          cp google-services-dummy.json TMessagesProj/google-services.json
          cp google-services-dummy.json TMessagesProj_App/google-services.json

      - name: Configure Gradle memory & arm64-v8a flags
        run: |
          chmod +x gradlew
          echo "" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties

      - name: Build Xabarchi Debug APK (arm64-v8a only)
        run: |
          if grep -q "afat" TMessagesProj_App/build.gradle; then
            TASK=":TMessagesProj_App:assembleAfatDebug"
          else
            TASK=":TMessagesProj_App:assembleDebug"
          fi
          echo "Running Gradle task: $TASK"
          ./gradlew "$TASK" \
            -Parm64-v8a \
            -Pandroid.injected.build.abi=arm64-v8a \
            --no-daemon \
            --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out_apk
          find TMessagesProj_App/build/outputs/apk -type f -name "*.apk" -exec cp {} out_apk/ \;
          ls -lh out_apk/

      - name: Upload Xabarchi APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xabarchi-arm64-debug-apk
          path: out_apk/*.apk
          retention-days: 14
